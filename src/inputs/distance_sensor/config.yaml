# Distance sensor manager configuration (src/inputs/distance_sensor/master_sensor.py).
distance_sensor:
  # Which driver to use:
  #   "vl53l1x_i2c"  VL53L0/1XV2 board with a VL53L1X chip (I2C model id 0xEACC)
  #   "none"         no sensor: the node stays RECONNECTING
  type: "vl53l1x_i2c"
  i2c_bus: 1                   # Pi pins 3 (SDA) / 5 (SCL)
  i2c_address: 0x29
  rate_hz: 30                  # measurements per second (must fit the timing budget)

  vl53l1x:
    distance_mode: "long"      # "long" (up to ~4 m, dark) or "short" (up to ~1.3 m, best in sunlight)
    # Time per measurement: 15*/20/33/50/100/200/500 (*short only).
    # Bench test 2026-11-21 over the flight-area floor: valid at 0.09 m with every budget,
    # but ~100% "signal fail" at 1.5 m with 33, 50 AND 100 ms -> a longer budget does not
    # add range on this floor (too little light returns). Usable ceiling here: ~1.3 m.
    timing_budget_ms: 33

  settings:
    read_timeout: 1.0          # sensor silent for this long -> reconnect
