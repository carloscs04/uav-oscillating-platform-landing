# Vision system configuration.
#
# The application uses ONE camera at a time: `active_camera`.
# The other entries are calibrated spares, swapped in by changing that line.
# A calibration is only valid for one camera at one resolution and sensor
# mode, so do not change `resolution` / `sensor_mode` after calibrating.

active_camera: usb_0bdc_8088 # SWITCHABLE!!

# If the active camera fails to open, try the other cameras below in order.
fallback: true

cameras:
  csi_imx219:
    backend: csi
    model: imx219              # matched against libcamera's sensor model
    resolution: [1640, 1232]   # image size delivered to the application
    sensor_mode: [1640, 1232]  # full field of view, 2x2 binned (3280x2464 = full res, 21 fps)
    fps: 60
    tuning_file: imx219_noir.json   # uncomment if the module has no IR-cut filter (purple tint)
    rotate_180: false          # set true if the camera is mounted upside down
    nominal_focal_px: 1357     # datasheet value, only used if calib/ has no file for this camera

  usb_0bdc_8088:
    backend: usb
    device: "/dev/video0"
    resolution: [640, 480]
    fps: 30
    fourcc: MJPG
    rotate_180: false
    nominal_focal_px: 600

# ChArUco calibration board (python3 -m calibration.board makes the printable PDF).
# The default fits A4 landscape. After printing, MEASURE a square with calipers
# and put the real size in square_mm / marker_mm: printers scale slightly.
charuco_board:
  squares_x: 9                 # squares across
  squares_y: 6                 # squares down -> 8 x 5 = 40 inner corners
  square_mm: 29.0              # chessboard square side (measured on the print: designed 30.0)
  marker_mm: 21.3              # ArUco marker side (designed 22.0, same 96.7% print scale)
  dictionary: DICT_5X5_100     # different from the flight markers, so they never get mixed up
  paper: A4                    # A4 or A3 (landscape), only used for the printable file

calibration:
  min_corners: 12              # ignore views showing fewer ChArUco corners
  target_images: 30            # capture tool shows progress towards this
  max_view_error_px: 1.0       # views above this (and 2x the median) are dropped and re-solved

# Flight markers (landing platform). Distances come out in the same unit as
# the marker size, so the size must be the REAL printed black square, edge to edge.
aruco:
  dictionary: DICT_4X4_50
  marker_mm: 100.0             # black square side, NOT including the white margin (measured on the print)
  ids: [10, 25, 32]            # only these are reported; [] = report every ID
  sizes_mm: {}                 # per-ID override, e.g. {32: 40.0} for a small nested marker
  max_reproj_err_px: 2.0       # poses fitting worse than this are flagged as unreliable

# Onboard vision node (src/inputs/camera_driver/master_camera.py).
# Onboard camera node (src/inputs/camera_driver/camera_node.py). It fills
# CameraState (video preview, port 5003) and VisionState (aruco_pose, port 5006).
vision:
  primary_ids: [10, 25, 32]    # the reported target = first of these that is visible (order = priority)
  smoothing: 0.6               # weight of the newest reading, 0..1 (1.0 = no smoothing, no lag)
  max_jump_m: 0.30             # a bigger jump between frames restarts the smoothing instead of averaging
  hold_s: 0.5                  # keep reporting a lost marker this long (tracking_state HOLDING), then drop it
  preview_width: 480           # video preview sent to the ground station (UDP packets are max ~64 KB)
  preview_quality: 60          # JPEG quality of that preview
  preview_hz: 15               # how often the preview is encoded (CameraTransmitter sends at ~25 Hz)
  reopen_after_failures: 30    # consecutive failed frame reads before the camera is closed and reopened
