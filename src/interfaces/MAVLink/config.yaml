mavlink:
  targets:
    SIMULATION:
      uri: "udp:127.0.0.1:14540"
      baud_rate: 921600
    HARDWARE:
      uri: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
      baud_rate: 921600

  settings:
    heartbeat_timeout: 3.0
    max_connection_retries: 15
    # MAVLink identity of the Pi. 1/191 = companion computer on vehicle 1.
    # pymavlink's default 255/0 shares system id 255 with QGroundControl.
    # To roll back to the old behaviour set 255 / 0.
    source_system: 1
    source_component: 191