# Vision manager configuration (src/logic/vision/master_vision.py).
# Camera selection and calibration are in src/inputs/camera_driver/config.yaml.

# Flight markers (landing platform). Distances come out in the same unit as
# the marker size, so the size must be the REAL printed black square, edge to edge.
aruco:
  dictionary: DICT_4X4_50
  marker_mm: 100.0             # black square side, NOT including the white margin (measured on the print)
  ids: [10, 25, 32]            # only these are reported; [] = report every ID
  sizes_mm: {}                 # per-ID override, e.g. {32: 40.0} for a small nested marker
  max_reproj_err_px: 2.0       # poses fitting worse than this are flagged as unreliable

# Target tracking -> VisionState (aruco_pose, sent by Bridge_WIFI tx/vision.py on port 5006).
tracking:
  primary_ids: [10, 25, 32]    # the reported target = first of these that is visible (order = priority)
  smoothing: 0.6               # weight of the newest reading, 0..1 (1.0 = no smoothing, no lag)
  max_jump_m: 0.30             # a bigger jump between frames restarts the smoothing instead of averaging
  hold_s: 0.5                  # keep reporting a lost marker this long (tracking_state HOLDING), then drop it

settings:
  frame_timeout: 1.0           # no new camera frame for this long -> vision reports RECONNECTING
